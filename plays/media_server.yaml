---
- name: Update Media Server
  hosts: media_server
  become: yes
  vars:
    ansible_become_password: "{{ vault_become_pass }}"
    emby_compose_dir: "/home/hoss/emby-docker"
    tailscale_compose_dir: "/home/hoss/tailscale-docker"
  tasks:
    - name: 1. Upgrade all host OS packages
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist

    - name: 2. Update and restart Containerized Tailscale
      community.docker.docker_compose_v2:
        project_src: "{{ tailscale_compose_dir }}"
        state: present
        pull: always

    - name: 3. Update and restart Containerized Emby Server
      community.docker.docker_compose_v2:
        project_src: "{{ emby_compose_dir }}"
        state: present
        pull: always

    - name: 4. Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: 5. Reboot Media Server if required
      ansible.builtin.reboot:
        reboot_timeout: 300
      when: reboot_required_file.stat.exists and not ansible_check_mode

    # --- POST-RUN CONTAINER VERIFICATION ---

    - name: 6. Wait for Emby web interface (Local Check)
      ansible.builtin.wait_for:
        port: 8096
        host: 127.0.0.1
        state: started
        delay: 5
        timeout: 60
      when: not ansible_check_mode

    - name: 7. Gather Docker container facts
      community.docker.docker_container_info:
        name: "{{ item }}"
      register: container_facts
      loop:
        - emby
        - tailscale

    - name: 8. Verify Containers are actively running
      ansible.builtin.assert:
        that:
          - container_facts.results[0].container.State.Running == true
          - container_facts.results[1].container.State.Running == true
        fail_msg: "One or more critical containers failed to remain in a running state!"
        success_msg: "All containers (Emby, Tailscale) are confirmed healthy and active."

    - name: 9. Show Tailscale IP Status from Container
      ansible.builtin.command: docker exec tailscale tailscale ip -4
      register: ts_ip
      changed_when: false

    - name: 10. Final Status Report
      ansible.builtin.debug:
        msg: "Media Server is back online. Tailscale IP: {{ ts_ip.stdout }}"